id: small-change-v1
task_types: [small_change]
max_ci_loops: 1
summary: Scoped edit → smoke → light review → PR (escalate if scope grows)
stages:
  - name: setup_env
    role: Orchestrator
    skills: [env-setup]
    human_gate: false
    exit_when: worktree ready (env may be lightweight)
    on_fail: retry
    agent_preference: { capability: env, cost: low }

  - name: clarify
    role: Orchestrator
    skills: [scoped-edit]
    human_gate: false
    skip_when: scope is clearly small
    exit_when: skipped, or reclassified to new_feature/bug_fix if scope grew
    on_fail: escalate
    agent_preference: { capability: clarify, cost: low }

  - name: plan
    role: Planner
    skills: [scoped-edit]
    human_gate: false
    skip_when: change is trivial and localized
    exit_when: skipped or tiny plan recorded
    on_fail: retry
    agent_preference: { capability: plan, cost: low }

  - name: develop
    role: Developer
    skills: [scoped-edit]
    human_gate: false
    exit_when: scoped edit complete without drive-by refactors
    on_fail: retry
    agent_preference: { capability: code, cost: low }

  - name: test
    role: Developer
    skills: [smoke-check]
    human_gate: false
    exit_when: smoke or related tests pass
    on_fail: goto:develop
    agent_preference: { capability: test, cost: low }

  - name: review
    role: Reviewer
    skills: [review-checklist]
    human_gate: false
    exit_when: light review approve; reject if out of scope
    on_fail: goto:develop
    agent_preference: { capability: review, cost: low }

  - name: open_pr
    role: Developer
    skills: [open-pr]
    human_gate: false
    exit_when: pr_url written
    on_fail: retry
    agent_preference: { capability: code, cost: low }

  - name: cicd
    role: Orchestrator
    skills: [ci-loop]
    human_gate: false
    exit_when: CI green or blocked at max_ci_loops
    on_fail: goto:develop
    agent_preference: { capability: classify, cost: low }

  - name: experience
    role: Orchestrator
    skills: [experience-write]
    human_gate: false
    skip_when: no lasting lesson
    exit_when: optional short convention/config note, or explicit skip
    on_fail: escalate
    agent_preference: { capability: write, cost: low }
